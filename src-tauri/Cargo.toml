[package]
name = "hamster"
version = "0.26.0"
description = "Private macOS app that collects ANV documents with the real amount paid, keeps bank statements and tracks subscriptions"
authors = ["Philipp Stracker <info@philippstracker.com>"]
edition = "2024"
license = "MIT"

[lib]
name = "hamster_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
log = "0.4"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "net", "fs"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
ts-rs = { version = "12", features = ["serde-compat", "serde-json-impl", "no-serde-warnings"] }
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSDateFormatter", "NSFormatter", "NSLocale", "NSData", "NSURL", "NSGeometry", "NSDictionary", "NSValue", "NSObject", "NSRange"] }
tempfile = { version = "3", optional = true }
# SQLite with FTS5, compiled in (ADR 0012).
rusqlite = { version = "0.37", features = ["bundled"] }
objc2-pdf-kit = { version = "0.3", default-features = false, features = ["std", "PDFDocument", "PDFPage", "PDFSelection", "PDFView", "objc2-app-kit", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSView", "NSResponder", "NSWindow", "NSColor", "NSGraphics"] }
sha2 = "0.10"

[features]
# Exposes test helpers to integration tests in tests/.
test-util = ["dep:tempfile"]

# Debug builds keep file and line numbers for backtraces, not full debug info; dependencies keep none. This
# shrinks target/ by more than half (scripts/clean-build.sh removes what is left over).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
# Panics unwind (ADR 0005): a bug fails one command, not the app.
panic = "unwind"

[dev-dependencies]
# Itself with test helpers, so integration tests in tests/ can use them (ADR 0021).
hamster = { path = ".", features = ["test-util"] }
tempfile = "3"
proptest = "1"
tokio = { version = "1", features = ["test-util", "macros", "rt"] }
